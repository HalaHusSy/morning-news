<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning News · เดลี่บรีฟ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <p class="greeting" id="greeting">สวัสดีตอนเช้า ☀️</p>
        <h1 id="today">—</h1>
        <p class="sub" id="meta">กำลังโหลดข่าว…</p>
      </div>
      <div class="hero-actions">
        <button id="refresh" class="btn" title="โหลดข้อมูลใหม่">↻ รีเฟรช</button>
      </div>
    </div>
  </header>

  <nav class="controls">
    <div class="controls-inner">
      <div class="chip-row" id="country-chips" aria-label="กรองตามประเทศ"></div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="ค้นหาหัวข้อข่าว / แหล่งข่าว…" autocomplete="off" />
      </div>
    </div>
  </nav>

  <main id="content" class="content">
    <div class="loading" id="loading">กำลังโหลด…</div>
  </main>

  <footer class="footer">
    <span id="footer-meta"></span>
    <span class="footer-note">ดึงข่าวจากแหล่งข่าวต้นทางโดยตรง · ยังไม่เปิดใช้ AI สรุป/แปล</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
